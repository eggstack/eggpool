name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check src/ tests/ scripts/
      - run: uv run ruff check src/ tests/ scripts/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
      - run: uv run pyright src/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev

      - name: Show test collection counts
        run: |
          echo "--- Unit/integration suite ---"
          uv run pytest --collect-only -q 2>/dev/null | tail -1
          echo "--- Soak framework (excluding extended_soak) ---"
          uv run pytest --collect-only -q -m "not extended_soak" tests/soak/ 2>/dev/null | tail -1
          echo "--- Performance tests ---"
          uv run pytest --collect-only -q -m performance 2>/dev/null | tail -1

      - name: Run unit and integration suites
        run: uv run pytest -q

      - name: Run soak framework/drain tests (excluding extended_soak)
        run: uv run pytest -q -m "not extended_soak" tests/soak/

      - name: Run bounded performance-contract tests
        run: uv run pytest -q -m performance

      - name: Run consistency auditor tests
        run: uv run pytest -q tests/soak/test_db_consistency_audit.py
