# ---------------------------------------------------------------------------
# EggPool CI
#
# Single job: Rust qualification plus retained tooling checks.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "plans/**"
      - "docs/**"
      - "architecture/**"
      - ".opencode/skills/**"
      - "AGENTS.md"
      - "CHANGELOG.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "plans/**"
      - "docs/**"
      - "architecture/**"
      - ".opencode/skills/**"
      - "AGENTS.md"
      - "CHANGELOG.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets -- --test-threads=1
      - run: uv sync --frozen
      - run: uv run ruff format --check scripts/ tests/tooling/
      - run: uv run ruff check scripts/ tests/tooling/
      - run: uv run pyright scripts/
      - run: uv run pytest tests/tooling/ -q --tb=short --maxfail=1
