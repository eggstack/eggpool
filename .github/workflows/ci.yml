# ---------------------------------------------------------------------------
# EggPool CI — Phase 12 partitioned pipeline
#
# Jobs run in parallel where possible.  Correctness jobs (unit-integration,
# reload-control) exercise a Python 3.11 + 3.12 matrix; performance and
# soak run on 3.12 only (one version is sufficient for expensive suites).
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant PR runs but never cancel pushes to main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  # ------------------------------------------------------------------
  # 1. Lint — fast, no Python matrix needed
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check src/ tests/ scripts/
      - run: uv run ruff check src/ tests/ scripts/

  # ------------------------------------------------------------------
  # 2. Typecheck — pyright strict mode
  # ------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
      - run: uv run pyright src/ scripts/

  # ------------------------------------------------------------------
  # 3. Unit + integration tests — Python matrix
  #    Excludes soak, performance, slow, extended_soak, live, and
  #    reload tests (reload has its own dedicated job).
  # ------------------------------------------------------------------
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev

      - name: Run unit and integration tests
        run: >
          uv run pytest
          -m "not slow and not performance and not soak and not extended_soak and not live"
          --ignore=tests/integration/reload/
          -q --tb=short
          ${{ matrix.python-version == '3.11' && '-vv --capture=tee-sys -o faulthandler_timeout=300 --durations=25' || '' }}

      - name: Upload test logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-logs-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            *.log
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 4. Reload / control-plane tests — Python matrix
  #    Targets the integration/reload/ directory directly since no tests
  #    currently carry the @pytest.mark.reload marker.
  # ------------------------------------------------------------------
  reload-control:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev

      - name: Run reload/rehash and control-plane tests
        run: uv run pytest tests/integration/reload/ -q --tb=short

      - name: Upload test logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reload-control-logs-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            *.log
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 4b. Plan 016 — Reload atomicity corrective closure focused tests.
  #     Runs the exact Plan 016 test command on a Python 3.11+3.12
  #     matrix so the corrective closure is exercised on every PR.
  # ------------------------------------------------------------------
  plan-016-corrective:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev

      - name: Plan 016 corrective closure tests
        run: |
          uv run pytest \
            tests/unit/test_runtime_manager.py \
            tests/unit/test_process_transition_plan.py \
            tests/unit/test_control_server.py \
            tests/unit/test_reload_diagnostics_matrix.py \
            tests/unit/test_reload_manager.py \
            tests/unit/test_phase6_fault_injection.py \
            tests/unit/test_published_swap_protocol.py \
            tests/integration/reload/test_pending_swap_visibility.py \
            tests/integration/reload/test_sqlite_commit_failure.py \
            tests/integration/reload/test_plan_016_corrective_replacements.py \
            tests/integration/reload/test_reload_fault_matrix.py \
            -q --tb=short

      - name: Upload test logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-016-logs-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            *.log
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 5. Performance — bounded perf-contract tests (3.12 only)
  # ------------------------------------------------------------------
  performance:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev

      - name: Run performance-contract tests
        run: uv run pytest -m performance -q --tb=short

      - name: Upload test logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-logs
          path: |
            .pytest_cache/
            *.log
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 6. Soak + audit — short deterministic soak, consistency audit, and
  #    skip/xfail policy audit (3.12 only)
  # ------------------------------------------------------------------
  soak-audit:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev

      - name: Run short deterministic soak tests
        run: >
          uv run pytest
          -m "soak and not extended_soak"
          tests/soak/
          -q --tb=short

      - name: Run database consistency audit
        run: uv run pytest tests/soak/test_db_consistency_audit.py -q --tb=short

      - name: Run skip/xfail policy audit
        run: uv run python scripts/audit_xfail_skips.py

      - name: Upload test logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-audit-logs
          path: |
            .pytest_cache/
            *.log
          retention-days: 7
          if-no-files-found: ignore
