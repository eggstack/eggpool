# ---------------------------------------------------------------------------
# EggPool CI
#
# Single job: Rust qualification plus retained tooling checks.
# ---------------------------------------------------------------------------

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "plans/**"
      - "docs/**"
      - "architecture/**"
      - ".opencode/skills/**"
      - "AGENTS.md"
      - "CHANGELOG.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "plans/**"
      - "docs/**"
      - "architecture/**"
      - ".opencode/skills/**"
      - "AGENTS.md"
      - "CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          python-version: "3.11"
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --no-default-features
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets -- --test-threads=1
      - run: uv sync --locked
      - run: uv run python scripts/validate_workflow_hygiene.py
      - run: >-
          uv run python scripts/validate_release_workflow.py
          .github/workflows/release.yml
          .github/workflows/qualification-release-artifacts.yml
          .github/workflows/qualification-public-release.yml
      - run: uv run ruff format --check scripts/ tests/tooling/
      - run: uv run ruff check scripts/ tests/tooling/
      - run: uv run pyright scripts/
      - run: uv run pytest tests/tooling/ -q --tb=short --maxfail=1
