# ---------------------------------------------------------------------------
# EggPool CI
#
# Two jobs:
#   check       — primary Python 3.12 lint + typecheck + canonical tests
#   compat-311  — narrow Python 3.11 compatibility smoke
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check src/ tests/ scripts/
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run pyright src/ scripts/
      - run: >
          uv run pytest
          -m "not slow and not performance and not soak and not extended_soak and not live and not network"
          -q --tb=short --maxfail=1

  compat-311:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/smoke/ -q --tb=short --maxfail=1
