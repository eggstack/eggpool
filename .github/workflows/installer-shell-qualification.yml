name: Installer shell qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/qualify_quick_installer.py"
      - "tests/tooling/test_installer.py"
      - "README.md"
      - "docs/**"
      - ".github/workflows/installer-shell-qualification.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/qualify_quick_installer.py"
      - "tests/tooling/test_installer.py"
      - "README.md"
      - "docs/**"
      - ".github/workflows/installer-shell-qualification.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  shell:
    name: ${{ matrix.os }} installer shell behavior
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux Bash
            runner: ubuntu-latest
          - os: macOS zsh
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest tests/tooling/test_installer.py -q --tb=short --maxfail=1
