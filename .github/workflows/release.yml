# K008: build the exact K003 artifact set once, validate it, then publish the
# downloaded bytes through separately privileged channels.  The production
# branches are intentionally tag-only; workflow_dispatch is rehearsal-only.

name: Rust release supply chain

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      destination:
        description: Non-production destination for a manual rehearsal
        required: true
        type: choice
        options:
          - validate
          - testpypi
        default: validate

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  RELEASE_REPOSITORY: eggstack/eggpool

jobs:
  validate-release:
    name: validate immutable release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - id: identity
        name: validate candidate, tag, and workflow contract
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          python scripts/validate_release_workflow.py .github/workflows/release.yml
          if [ -n "$RELEASE_TAG" ]; then
            result="$(python scripts/validate_cutover_release.py --tag "$RELEASE_TAG" --source-commit "$GITHUB_SHA")"
          else
            result="$(python scripts/validate_cutover_release.py --source-commit "$GITHUB_SHA")"
          fi
          version="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["version"])' "$result")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build-wheel-linux-x86-64:
    name: build linux x86_64 wheel/raw pair
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.88.0"
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7
        with:
          version: "0.13.0"
      - run: >-
          uv run --no-project --with maturin==1.14.1 python
          scripts/build_cutover_artifacts.py
          --target-class linux-x86_64
          --out dist/release/linux-x86_64
      - run: >-
          uv run --no-project --with maturin==1.14.1 python
          scripts/qualify_cutover_wheel.py
          dist/release/linux-x86_64/eggpool-${{ needs.validate-release.outputs.version }}-*.whl
          --target-class linux-x86_64
          --version ${{ needs.validate-release.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k008-linux-x86_64
          path: dist/release/linux-x86_64
          if-no-files-found: error

  build-wheel-linux-aarch64:
    name: build linux aarch64 wheel/raw pair
    needs: validate-release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.88.0"
          targets: aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7
        with:
          version: "0.13.0"
      - run: >-
          uv run --no-project --with maturin==1.14.1 python
          scripts/build_cutover_artifacts.py
          --target-class linux-aarch64
          --out dist/release/linux-aarch64
      - run: >-
          uv run --no-project --with maturin==1.14.1 python
          scripts/qualify_cutover_wheel.py
          dist/release/linux-aarch64/eggpool-${{ needs.validate-release.outputs.version }}-*.whl
          --target-class linux-aarch64
          --version ${{ needs.validate-release.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k008-linux-aarch64
          path: dist/release/linux-aarch64
          if-no-files-found: error

  build-wheel-macos-arm64:
    name: build macOS arm64 wheel/raw pair
    needs: validate-release
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.88.0"
          targets: aarch64-apple-darwin
      - run: >-
          uv run --no-project --with maturin==1.14.1 python
          scripts/build_cutover_artifacts.py
          --target-class macos-arm64
          --out dist/release/macos-arm64
      - run: >-
          uv run --no-project --with maturin==1.14.1 python
          scripts/qualify_cutover_wheel.py
          dist/release/macos-arm64/eggpool-${{ needs.validate-release.outputs.version }}-*.whl
          --target-class macos-arm64
          --version ${{ needs.validate-release.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k008-macos-arm64
          path: dist/release/macos-arm64
          if-no-files-found: error

  aggregate-release-manifest:
    name: validate and aggregate exact release bytes
    needs:
      - validate-release
      - build-wheel-linux-x86-64
      - build-wheel-linux-aarch64
      - build-wheel-macos-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: k008-*
          path: dist/targets
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d
      - name: restore executable staging mode
        run: >-
          find dist/targets -type f \( -name 'eggpool-*-linux-*' -o
          -name 'eggpool-*-macos-*' \) -exec chmod 755 {} +
      - run: >-
          uv run --no-project --with maturin==1.14.1 python
          scripts/create_cutover_manifest.py
          --artifact-dir dist/targets
          --output dist/release-manifest.json
          --qualification-result pass
      - run: >-
          uv run --no-project --with maturin==1.14.1 python
          scripts/validate_cutover_artifacts.py
          dist/release-manifest.json
          --artifact-dir dist/targets
      - name: assemble publish bundle without rebuilding
        run: |
          set -eu
          version="${{ needs.validate-release.outputs.version }}"
          mkdir -p dist/publish/wheels dist/publish/raw
          find dist/targets -type f -name "eggpool-${version}-*.whl" -exec cp {} dist/publish/wheels/ \;
          find dist/targets -type f \( -name "eggpool-${version}-linux-*" -o -name "eggpool-${version}-macos-*" \) | while read -r asset; do
            cp "$asset" dist/publish/raw/
          done
          cp dist/release-manifest.json "dist/publish/eggpool-${version}-release-manifest.json"
          (cd dist/publish && sha256sum wheels/* raw/* "eggpool-${version}-release-manifest.json" > SHA256SUMS)
          test "$(find dist/publish/wheels -type f -name '*.whl' | wc -l)" -eq 3
          test "$(find dist/publish/raw -type f -name "eggpool-${version}-*" | wc -l)" -eq 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k008-release-bundle
          path: dist/publish
          if-no-files-found: error

  publish-testpypi:
    name: publish rehearsal wheels to TestPyPI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destination == 'testpypi' }}
    needs: aggregate-release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/eggpool
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: k008-release-bundle
          path: dist/publish
      - name: publish exact validated wheels to TestPyPI
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26
        with:
          packages-dir: dist/publish/wheels
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: publish exact validated wheels to PyPI
    if: ${{ github.event_name == 'push' && github.repository == 'eggstack/eggpool' && github.ref == format('refs/tags/v{0}', needs.validate-release.outputs.version) }}
    needs:
      - validate-release
      - aggregate-release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/eggpool
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: k008-release-bundle
          path: dist/publish
      - name: publish exact validated wheels to PyPI
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26
        with:
          packages-dir: dist/publish/wheels
          attestations: true

  publish-github-release:
    name: attach exact raw assets and manifest to GitHub release
    if: ${{ github.event_name == 'push' && github.repository == 'eggstack/eggpool' && github.ref == format('refs/tags/v{0}', needs.validate-release.outputs.version) }}
    needs:
      - validate-release
      - aggregate-release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: k008-release-bundle
          path: dist/publish
      - name: attach exact validated raw assets and checksums
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            dist/publish/raw/*
            dist/publish/eggpool-${{ needs.validate-release.outputs.version }}-release-manifest.json
            dist/publish/SHA256SUMS

  verify-production-release:
    name: verify stable public release metadata
    if: ${{ github.event_name == 'push' && github.repository == 'eggstack/eggpool' && github.ref == format('refs/tags/v{0}', needs.validate-release.outputs.version) }}
    needs:
      - validate-release
      - publish-pypi
      - publish-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: k008-release-bundle
          path: dist/publish
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: verify PyPI hashes, GitHub digests, and stable release state
        run: >-
          python scripts/verify_published_release.py
          dist/publish/eggpool-${{ needs.validate-release.outputs.version }}-release-manifest.json
          --pypi-json
          <(curl --fail --silent --show-error --location https://pypi.org/pypi/eggpool/${{ needs.validate-release.outputs.version }}/json)
          --github-json
          <(curl --fail --silent --show-error --location https://api.github.com/repos/eggstack/eggpool/releases/tags/${{ github.ref_name }})
