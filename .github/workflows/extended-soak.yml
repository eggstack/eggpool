name: Extended Soak Validation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Soak profile"
        required: false
        default: "balanced-file-backed"
        type: choice
        options:
          - balanced-file-backed
          - burst-recovery
          - cancellation-maintenance
          - rehash-churn
          - slow-storage
          - sbc-reference
      seed:
        description: "Random seed"
        required: false
        default: "42"
        type: string
      duration-seconds:
        description: "Duration in seconds (default 1800)"
        required: false
        default: "1800"
        type: string

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

concurrency:
  group: extended-soak
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run dispatch stability soak
        run: |
          uv run python scripts/run_dispatch_stability_soak.py \
            --profile "${{ inputs.profile || 'balanced-file-backed' }}" \
            --duration-seconds "${{ inputs.duration-seconds || '1800' }}" \
            --seed "${{ inputs.seed || '42' }}" \
            --output /tmp/eggpool-soak-result.json

      - name: Upload soak result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-result
          path: /tmp/eggpool-soak-result.json
          retention-days: 30
          if-no-files-found: ignore
