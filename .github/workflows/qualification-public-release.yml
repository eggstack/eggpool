name: public release public package qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public Rust release to qualify (defaults to the repository's current release)
        required: false
        default: ""
      python_version:
        description: Public Python rollback release to qualify (defaults to the repository's historical Python release)
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  resolve-version:
    name: derive release versions from the repository authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      python_version: ${{ steps.identity.outputs.python_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d
        with:
          python-version: "3.11"
      - id: identity
        name: derive the release versions from the repository version authority
        run: |
          result="$(uv run --no-project --python 3.11 python scripts/validate_release_identity.py --source-commit "$GITHUB_SHA")"
          version="$(uv run --no-project --python 3.11 python -c 'import json,sys; print(json.loads(sys.argv[1])["version"])' "$result")"
          python_version="$(uv run --no-project --python 3.11 python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version_authority"]["historical_python_project_version"])' rust/assets/catalog/installable-releases.json)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'python_version=%s\n' "$python_version" >> "$GITHUB_OUTPUT"

  public-index:
    name: ${{ matrix.target_class }} public install and rollback
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PUBLIC_VERSION: ${{ inputs.version || needs.resolve-version.outputs.version }}
      PUBLIC_PYTHON_VERSION: ${{ inputs.python_version || needs.resolve-version.outputs.python_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_class: linux-x86_64
            runner: ubuntu-latest
            managers: uv-tool pipx pip
          - target_class: linux-aarch64
            runner: ubuntu-24.04-arm
            managers: uv-tool
          - target_class: macos-arm64
            runner: macos-14
            managers: uv-tool
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d
        with:
          python-version: "3.11"
      - name: install pipx for the public manager matrix
        run: |
          python -m pip install --user pipx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx --version
      - name: download public release artifacts
        run: |
          set -eu
          mkdir -p dist/public
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --dest dist/public \
            "eggpool==${PUBLIC_PYTHON_VERSION}"
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --dest dist/public \
            "eggpool==${PUBLIC_VERSION}"
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["PUBLIC_VERSION"]
          python_version = os.environ["PUBLIC_PYTHON_VERSION"]
          files = sorted(Path("dist/public").glob("*.whl"))
          if not any(python_version in path.name for path in files):
              raise SystemExit("public Python rollback wheel was not resolved")
          if not any(version in path.name for path in files):
              raise SystemExit("public Rust wheel was not resolved")
          print("resolved public wheels:", *(path.name for path in files), sep="\n")
          PY
      - name: qualify public Rust wheel runtime and dashboard
        run: |
          rust_wheel="$(find dist/public -type f -name "eggpool-${PUBLIC_VERSION}-*.whl" -print -quit)"
          test -n "$rust_wheel"
          uv run python scripts/qualify_release_wheel.py \
            "$rust_wheel" \
            --target-class "${{ matrix.target_class }}" \
            --version "$PUBLIC_VERSION"
      - name: qualify public Python to Rust rollback cycle
        env:
          RELEASE_COMPATIBILITY_DIAGNOSTIC_ERRORS: "1"
        run: |
          set -eu
          python_wheel="$(find dist/public -type f -name "eggpool-${PUBLIC_PYTHON_VERSION}-*.whl" -print -quit)"
          rust_wheel="$(find dist/public -type f -name "eggpool-${PUBLIC_VERSION}-*.whl" -print -quit)"
          test -n "$python_wheel"
          test -n "$rust_wheel"
          uv run python scripts/qualify_release_transitions.py \
            --python-wheel "$python_wheel" \
            --rust-wheel "$rust_wheel" \
            --python "$(command -v python)" \
            --public-index \
            --strict \
            $(for manager in ${{ matrix.managers }}; do printf '%s ' --manager "$manager"; done) \
            --output "dist/public-transition-${{ matrix.target_class }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-public-${{ matrix.target_class }}
          path: dist/public-transition-${{ matrix.target_class }}.json
