name: public release public package qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public Rust release to qualify
        required: true
        default: "0.8.0"
      python_version:
        description: Public Python rollback release to qualify
        required: true
        default: "0.7.4"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  public-index:
    name: ${{ matrix.target_class }} public install and rollback
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_class: linux-x86_64
            runner: ubuntu-latest
            managers: uv-tool pipx pip
          - target_class: linux-aarch64
            runner: ubuntu-24.04-arm
            managers: uv-tool
          - target_class: macos-arm64
            runner: macos-14
            managers: uv-tool
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d
        with:
          python-version: "3.11"
      - name: install pipx for the public manager matrix
        run: |
          python -m pip install --user pipx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx --version
      - name: download public release artifacts
        run: |
          set -eu
          mkdir -p dist/public
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --dest dist/public \
            "eggpool==${{ inputs.python_version }}"
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --dest dist/public \
            "eggpool==${{ inputs.version }}"
          python - <<'PY'
          from pathlib import Path

          files = sorted(Path("dist/public").glob("*.whl"))
          if not any("0.7.4" in path.name for path in files):
              raise SystemExit("public Python rollback wheel was not resolved")
          if not any("0.8.0" in path.name for path in files):
              raise SystemExit("public Rust wheel was not resolved")
          print("resolved public wheels:", *(path.name for path in files), sep="\n")
          PY
      - name: qualify public Rust wheel runtime and dashboard
        run: |
          rust_wheel="$(find dist/public -type f -name 'eggpool-${{ inputs.version }}-*.whl' -print -quit)"
          test -n "$rust_wheel"
          uv run python scripts/qualify_release_wheel.py \
            "$rust_wheel" \
            --target-class "${{ matrix.target_class }}" \
            --version "${{ inputs.version }}"
      - name: qualify public Python to Rust rollback cycle
        env:
          RELEASE_COMPATIBILITY_DIAGNOSTIC_ERRORS: "1"
        run: |
          set -eu
          python_wheel="$(find dist/public -type f -name 'eggpool-${{ inputs.python_version }}-*.whl' -print -quit)"
          rust_wheel="$(find dist/public -type f -name 'eggpool-${{ inputs.version }}-*.whl' -print -quit)"
          test -n "$python_wheel"
          test -n "$rust_wheel"
          uv run python scripts/qualify_release_transitions.py \
            --python-wheel "$python_wheel" \
            --rust-wheel "$rust_wheel" \
            --python "$(command -v python)" \
            --public-index \
            --strict \
            $(for manager in ${{ matrix.managers }}; do printf '%s ' --manager "$manager"; done) \
            --output "dist/public-transition-${{ matrix.target_class }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-public-${{ matrix.target_class }}
          path: dist/public-transition-${{ matrix.target_class }}.json
