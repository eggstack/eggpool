[package]
name = "eggpool"
version = "0.7.4"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Side-by-side Rust migration scaffold for EggPool"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
thiserror = "2"
tokio = { version = "1.44", features = ["macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
