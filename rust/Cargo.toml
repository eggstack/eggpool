[package]
name = "eggpool"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "A lightweight native proxy that aggregates multiple LLM provider accounts"

[workspace]
members = [
    "crates/eggpool-model-routing",
    "crates/eggpool-client-config",
    "crates/eggpool-connect",
]

[features]
default = ["ssh"]
# Repository-only physical qualification instrumentation.  This is never
# selected by release/package workflows and adds no dependencies.
qualification-db-diagnostics = []
# Test-only constructor for deterministic local TLS proxy peers.  The normal
# provider transport keeps Eggress's production-owned TLS configuration.
# `eggress-server/ssh` tracks the root `ssh` capability (which test-support
# always enables): eggress-server 1.0.8 re-exports
# `eggress-outbound::build_chain_executor`, whose arity is gated on the
# outbound crate's own `ssh` flag, so the server wrapper must be built with
# the same flag or its internal call site mismatches under feature
# unification. The seam still passes no SSH session cache.
test-support = [
    "ssh",
    "dep:eggress-core",
    "dep:eggress-config",
    "dep:eggress-pproxy-compat",
    "eggress-server/ssh",
    "dep:eggress-uri",
]
# The root SSH capability forwards to the listener-free outbound crate and
# enables SSH translation support on the pproxy compatibility package.
# Upstream keeps these as two independent cfg gates (`ssh` never implies
# `pproxy-compat`): pproxy-style SSH expressions construct only when both are
# enabled, matching the previous `eggress-embed/ssh` facade, which forwarded
# the same edge weakly from inside the facade. A weak `?` edge from here
# cannot work because the compatibility package reaches the production graph
# through `eggress-outbound`, not through this package's optional test-support
# edge; the strong edge below only flips that cfg flag (the package and its
# `ssh = []` feature add no new graph members) and never exposes the
# test-only chain executor seam to production constructors.
ssh = ["eggress-outbound/ssh", "eggress-pproxy-compat/ssh"]

[dependencies]
arc-swap = "1.9"
axum = "0.8"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
eggress-outbound = { version = "=1.0.8", default-features = false, features = [
    "pproxy-compat",
    "pproxy-legacy",
    "legacy-crypto",
] }
eggress-core = { version = "=1.0.8", optional = true }
eggress-config = { version = "=1.0.8", optional = true }
eggress-pproxy-compat = { version = "=1.0.8", optional = true }
eggress-server = { version = "=1.0.8", default-features = false, optional = true, features = [
    "extended",
] }
eggress-uri = { version = "=1.0.8", optional = true }
eggfetch-core = { version = "=0.2.0", default-features = false, features = [
    "native-http1",
    "tls-rustls",
] }
eggserve-server = { version = "=0.4.0", default-features = false, features = ["tower"] }
getrandom = "0.3.4"
eggpool-client-config = { path = "crates/eggpool-client-config" }
eggpool-model-routing = { path = "crates/eggpool-model-routing" }
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "tls12",
    "webpki-tokio",
] }
hyper-util = { version = "0.1", default-features = false, features = [
    "client-legacy",
    "http1",
    "tokio",
] }
nix = { version = "0.31.3", default-features = false, features = ["signal", "term", "user"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
thiserror = "2"
tokio = { version = "1.44", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled", "backup"] }
zip = { version = "2.4.2", default-features = false }
webpki-roots = "1"

[build-dependencies]
serde = "1"
serde_json = "1"

[dev-dependencies]
eggress-core = "=1.0.8"
eggress-protocol-shadowsocks = { version = "=1.0.8", features = [
    "legacy-crypto",
    "pproxy-legacy",
] }
rcgen = "0.14"
tempfile = "3"
eggress-protocol-trojan = "=1.0.8"
tokio-rustls = "0.26"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
