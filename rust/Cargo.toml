[package]
name = "eggpool"
version = "0.7.4"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Side-by-side Rust migration scaffold for EggPool"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
thiserror = "2"
tokio = { version = "1.44", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }

[build-dependencies]
serde = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
