[package]
name = "eggpool"
version = "0.7.4"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Side-by-side Rust migration scaffold for EggPool"

[features]
default = []
# Test-only constructor for deterministic local TLS proxy peers.  The normal
# provider transport keeps Eggress's production-owned TLS configuration.
test-support = []

[dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
eggress-embed = { version = "=1.0.2", default-features = false, features = [
    "common",
    "pproxy-compat",
    "extended",
    "pproxy-legacy",
    "legacy-crypto",
    "ssh",
] }
eggress-core = "=1.0.2"
eggress-config = { version = "=1.0.2" }
eggress-pproxy-compat = { version = "=1.0.2" }
eggress-server = { version = "=1.0.2", default-features = false, features = [
    "extended",
    "legacy-crypto",
    "pproxy-legacy",
    "ssh",
] }
eggress-uri = { version = "=1.0.2" }
eggress-transport-ssh = { version = "=1.0.2" }
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "tls12",
    "webpki-tokio",
] }
hyper-util = { version = "0.1", default-features = false, features = [
    "client-legacy",
    "http1",
    "tokio",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
thiserror = "2"
tokio = { version = "1.44", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
tower-service = "0.3"
webpki-roots = "1"

[build-dependencies]
serde = "1"
serde_json = "1"

[dev-dependencies]
eggress-protocol-shadowsocks = { version = "=1.0.2", features = [
    "legacy-crypto",
    "pproxy-legacy",
] }
rcgen = "0.14"
tempfile = "3"
eggress-protocol-trojan = "=1.0.2"
tokio-rustls = "0.26"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
