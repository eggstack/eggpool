[package]
name = "eggpool"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "A lightweight native proxy that aggregates multiple LLM provider accounts"

[workspace]
members = [
    "crates/eggpool-model-routing",
    "crates/eggpool-client-config",
    "crates/eggpool-connect",
]

[features]
default = ["eggress-ssh-fallback"]
# Test-only constructor for deterministic local TLS proxy peers.  The normal
# provider transport keeps Eggress's production-owned TLS configuration.
test-support = ["eggress-ssh-fallback"]
# Eggress 1.0.6's stable OutboundConnector does not install an SSH session
# cache, so SSH upstreams temporarily retain the narrow native executor path.
eggress-ssh-fallback = [
    "eggress-embed/ssh",
    "dep:eggress-core",
    "dep:eggress-config",
    "dep:eggress-pproxy-compat",
    "dep:eggress-server",
    "dep:eggress-uri",
    "dep:eggress-transport-ssh",
]

[dependencies]
arc-swap = "1.9"
axum = "0.8"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
eggress-embed = { version = "=1.0.6", default-features = false, features = [
    "pproxy-compat",
    "pproxy-legacy",
    "legacy-crypto",
] }
# The native executor is used only for the documented Eggress 1.0.6 SSH
# facade gap and the test-root trust seam; all other proxy construction uses
# eggress-embed.
eggress-core = { version = "=1.0.6", optional = true }
eggress-config = { version = "=1.0.6", optional = true }
eggress-pproxy-compat = { version = "=1.0.6", optional = true }
eggress-server = { version = "=1.0.6", default-features = false, optional = true, features = [
    "extended",
    "legacy-crypto",
    "pproxy-legacy",
    "ssh",
] }
eggress-uri = { version = "=1.0.6", optional = true }
eggress-transport-ssh = { version = "=1.0.6", optional = true }
eggfetch-core = { version = "=0.1.5", default-features = false, features = [
    "http1",
    "tls-rustls",
] }
getrandom = "0.3.4"
eggpool-client-config = { path = "crates/eggpool-client-config" }
eggpool-model-routing = { path = "crates/eggpool-model-routing" }
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "tls12",
    "webpki-tokio",
] }
hyper-util = { version = "0.1", default-features = false, features = [
    "client-legacy",
    "http1",
    "tokio",
] }
nix = { version = "0.31.3", default-features = false, features = ["signal", "term", "user"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
thiserror = "2"
tokio = { version = "1.44", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled", "backup"] }
zip = { version = "2.4.2", default-features = false }
tower-service = "0.3"
webpki-roots = "1"

[build-dependencies]
serde = "1"
serde_json = "1"

[dev-dependencies]
eggress-core = "=1.0.6"
eggress-protocol-shadowsocks = { version = "=1.0.6", features = [
    "legacy-crypto",
    "pproxy-legacy",
] }
rcgen = "0.14"
tempfile = "3"
eggress-protocol-trojan = "=1.0.6"
tokio-rustls = "0.26"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
