[package]
name = "eggpool-client-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false
description = "Portable client-configuration policy for EggPool connection profiles and Codex/OpenCode renderers"
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
