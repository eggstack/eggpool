[package]
name = "eggpool-connect"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Transactional desktop configurator for EggPool connection profiles (Codex/OpenCode)"
license = "MIT"

[[bin]]
name = "eggpool-connect"
path = "src/main.rs"

[lib]
name = "eggpool_connect"
path = "src/lib.rs"

[dependencies]
eggpool-client-config = { path = "../eggpool-client-config" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
tokio = { version = "1.44", features = ["rt", "macros", "process", "time", "net"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
