[providers.ollama-local]
# Ollama (local) — OpenAI compatible, no auth required
# Verification discovers installed models via /api/tags; no hardcoded probe model.
id = "ollama-local"
base_url = "http://localhost:11434/v1"
protocols = ["openai"]
api_key_env = "API_KEY"
display_name = "Ollama (local)"
status = "verified"
category = "local"
region = "local"
recommended = false
notes = "Local development; no auth required; models discovered at runtime"

[providers.ollama-local.auth]
mode = "none"

[providers.ollama-local.models_endpoint]
method = "GET"
path = "/api/tags"
required = true

[providers.ollama-local.verify]
probe_protocol = "openai"
require_models = true

[providers.ollama-local.model_capabilities.default.multimodal]
# Ollama supports base64 images through the OpenAI-compatible endpoint.
# URL images are not supported (Ollama fetches from data URIs only).
# Document PDF and audio support depend on the loaded model and are
# conservatively disabled.  The 5 MB limit is a local-runtime ceiling.
image_input = { base64 = true, url = false }
document_input = { base64 = false, url = false }
non_text_tool_result = false
max_serialized_request_bytes = 5242880

