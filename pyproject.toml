# Development-only tooling configuration. The current EggPool application and
# publication manifest live under rust/ and packaging/pypi/ respectively.

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.eggpool]
project_role = "repository-tooling-only"
current_runtime = "rust"
publication_manifest = "packaging/pypi/pyproject.toml"
historical_python_version = "0.7.4"
historical_artifacts = "immutable-external-pypi"
requires_python_semantics = "package-manager-compatibility-only"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
include = ["scripts"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = [".", "scripts"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "performance: manually invoked performance checks",
    "live: opt-in live provider/network verification",
]
