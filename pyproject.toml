[project]
name = "eggpool"
version = "0.6.5"
description = "A lightweight proxy that aggregates multiple LLM provider accounts behind an OpenAI Chat Completions-compatible endpoint"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "David Bowman", email = "dbowman91@proton.me" }]
keywords = [
    "llm",
    "proxy",
    "openai",
    "anthropic",
    "aggregation",
    "router",
    "multi-account",
    "opencode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115,<1",
    "granian[pname]>=2.0,<3",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "pydantic>=2.0,<3",
    "click>=8,<9",
]

[project.urls]
Homepage = "https://github.com/eggstack/eggpool"
Repository = "https://github.com/eggstack/eggpool"
Issues = "https://github.com/eggstack/eggpool/issues"
Documentation = "https://github.com/eggstack/eggpool/tree/main/docs"
Changelog = "https://github.com/eggstack/eggpool/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ci = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "respx",
]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
]
# ``fast`` enables the orjson-backed JSON helper used by the transcoding
# hot paths.  EggPool falls back to the stdlib implementation when this
# extra is not installed, so lightweight Raspberry Pi / SBC targets keep
# working without a Rust-built wheel.  Install with ``uv pip install
# 'eggpool[fast]'`` to enable it.
# orjson is intentionally bounded to the current major line; stdlib JSON
# remains the supported fallback for lightweight SBC installs.
fast = ["orjson>=3.10,<4"]
proxy = ["pproxy>=2.7.9,<3"]

[project.scripts]
eggpool = "eggpool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eggpool"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".opencode",
    ".agents",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    ".pyright",
    "dist",
    "build",
    "*.egg-info",
    "*.sqlite3",
    "*.sqlite3-wal",
    "*.sqlite3-shm",
    "coverage.xml",
    ".coverage",
    ".coverage.*",
    "htmlcov",
    "*.log",
    "/var",
    "plans",
    "tests",
]
exclude-globs = [
    "**/__pycache__",
    "**/.DS_Store",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
include = ["src", "scripts"]
exclude = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "performance: manually invoked real-runtime performance checks",
    "live: opt-in live provider/network verification tests",
    "network: tests requiring network access or external services",
    "integration: integration tests requiring full component wiring",
    "unit: unit tests",
]
