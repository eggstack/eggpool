[server]
host = "127.0.0.1"
port = __Q008_PORT__
api_key = "q008-server-key"
max_request_body_bytes = 1048576

[database]
path = "__Q008_DATABASE__"
busy_timeout_ms = 10000
wal = true
journal_size_limit = 67108864

[dashboard]
enabled = true
public = false

[models]
startup_refresh = true
refresh_interval_s = 1

[model_info]
enabled = false
startup_refresh = false

[metrics]
write_mode = "low_wear"
flush_interval_s = 2

[backup]
enabled = true
interval_s = 2
startup_delay_s = 1
retain_count = 2
directory = "__Q008_BACKUP_DIR__"
include_env = false

[providers.fixture]
id = "fixture"
base_url = "__Q008_UPSTREAM__"
protocols = ["openai", "anthropic"]

[providers.fixture.auth]
mode = "bearer"

[providers.fixture.wire_surfaces.openai_chat_completions]
path_template = "/chat/completions"
priority = 100

[providers.fixture.wire_surfaces.openai_chat_completions.auth]
mode = "bearer"

[providers.fixture.wire_surfaces.openai_responses]
path_template = "/responses"
priority = 100

[providers.fixture.wire_surfaces.openai_responses.auth]
mode = "bearer"

[providers.fixture.wire_surfaces.anthropic_messages]
path_template = "/messages"
priority = 100

[providers.fixture.wire_surfaces.anthropic_messages.auth]
mode = "bearer"

[providers.fixture.model_wire."q008-chat"]
preferred_surface = "openai_chat_completions"
fixed = true

[providers.fixture.model_wire."q008-responses"]
preferred_surface = "openai_responses"
fixed = true

[providers.fixture.model_wire."q008-messages"]
preferred_surface = "anthropic_messages"
fixed = true

[[providers.fixture.static_models]]
id = "q008-chat"
protocol = "openai"

[[providers.fixture.static_models]]
id = "q008-responses"
protocol = "openai"

[[providers.fixture.static_models]]
id = "q008-messages"
protocol = "anthropic"

[[providers.fixture.accounts]]
name = "q008-account"
api_key = "q008-provider-key"
