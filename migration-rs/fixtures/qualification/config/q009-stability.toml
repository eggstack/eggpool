[providers.unreachable]
id = "unreachable"
base_url = "http://127.0.0.1:1"
protocols = ["openai"]

[providers.unreachable.wire_surfaces.openai_chat_completions]
path_template = "/chat/completions"
priority = 100

[providers.unreachable.wire_surfaces.openai_chat_completions.auth]
mode = "bearer"

[[providers.unreachable.static_models]]
id = "q009-connect"
protocol = "openai"

[[providers.unreachable.accounts]]
