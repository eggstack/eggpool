[server]
host = "127.0.0.1"
port = __Q009_PORT__
api_key = "q009-server-key"
max_request_body_bytes = 1048576

[upstream]
connect_timeout_s = 0.25
read_timeout_s = 0.35
write_timeout_s = 0.35

[database]
path = "__Q009_DATABASE__"
busy_timeout_ms = 10000
wal = true
journal_size_limit = 67108864

[dashboard]
enabled = true
public = false

[models]
startup_refresh = true
refresh_interval_s = 1

[model_info]
enabled = false
startup_refresh = false

[metrics]
write_mode = "low_wear"
flush_interval_s = 2

[backup]
enabled = true
interval_s = 1
startup_delay_s = 1
retain_count = 2
directory = "__Q009_BACKUP_DIR__"
include_env = false

[providers.fixture]
id = "fixture"
base_url = "__Q009_UPSTREAM__"
protocols = ["openai", "anthropic"]

[providers.fixture.wire_surfaces.openai_chat_completions]
path_template = "/chat/completions"
priority = 100

[providers.fixture.wire_surfaces.openai_chat_completions.auth]
mode = "bearer"

[providers.fixture.wire_surfaces.openai_responses]
path_template = "/responses"
priority = 100

[providers.fixture.wire_surfaces.openai_responses.auth]
mode = "bearer"

[providers.fixture.wire_surfaces.anthropic_messages]
path_template = "/messages"
priority = 100

[providers.fixture.wire_surfaces.anthropic_messages.auth]
mode = "bearer"

[providers.fixture.model_wire."q009-chat"]
